# Scrape the workloads generated by the apps track. Their Services all carry
# app.kubernetes.io/part-of: apps from apps/<app>/base/kustomization.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apps-track
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/part-of: apps
  endpoints:
    - port: http
      interval: 30s
