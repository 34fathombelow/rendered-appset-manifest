# Adopts every Application on the `rendered` branch: all AppSets, all
# environments. This is the only hand-written link between the rendered branch
# and the cluster; everything below it is generated.
#
# It lives in the `default` project, like bootstrap/root.yaml: all it deploys is
# Application objects into argocd's namespace. What each generated Application
# may deploy is governed by its own project (apps, addons, ...), set per
# Application by its AppSet template.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rendered
  namespace: argocd
  # Deliberately no resources-finalizer: deleting this Application must never
  # cascade into every generated Application (and, through their finalizers,
  # every workload) in every environment at once.
spec:
  project: default
  source:
    repoURL: https://github.com/34fathombelow/rendered-appset-manifest.git
    targetRevision: rendered
    path: .
    directory:
      # The branch is <env>/<application>.yaml, so this has to recurse.
      recurse: true
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    # Environment-specific policy is applied per Application at render time by
    # scripts/render.sh, not here. Pruning here decides whether an Application
    # that stopped generating is deleted -- and because generated Applications
    # carry resources-finalizer, deleting one also deletes its workloads.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  revisionHistoryLimit: 10
