apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: addons
  namespace: argocd
spec:
  description: Platform addon track -- Applications rendered from appsets/addons.yaml
  sourceRepos:
    - https://github.com/34fathombelow/rendered-appset-manifest.git
  destinations:
    - name: '*'
      namespace: '*'
      server: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  # Addons legitimately install CRDs, ClusterRoles and webhooks.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: appset-generate
      description: Read-only role used by CI to run 'argocd appset generate'
      policies:
        - p, proj:addons:appset-generate, applications, get, addons/*, allow
        - p, proj:addons:appset-generate, applicationsets, get, addons/*, allow
        - p, proj:addons:appset-generate, repositories, get, https://github.com/34fathombelow/rendered-appset-manifest.git, allow
        # The cluster generator in appsets/addons.yaml has to enumerate every
        # registered cluster, so this cannot be narrowed to one project.
        - p, proj:addons:appset-generate, clusters, get, '*', allow
