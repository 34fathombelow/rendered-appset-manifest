# Adopts every Application on the rendered-dev branch: all AppSets, dev only.
# One app-of-apps per env branch, so a sync or prune here can never reach
# another environment.
#
# It lives in the `default` project, like bootstrap/root.yaml: all it deploys is
# Application objects into argocd's namespace. What each generated Application
# may deploy is governed by its own project (apps, addons, ...), set per
# Application by its AppSet template.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rendered-dev
  namespace: argocd
  labels:
    gitops.34fathombelow.io/env: dev
  # Deliberately no resources-finalizer: deleting this Application must never
  # cascade into every generated Application (and, through their finalizers,
  # every workload) in the environment.
spec:
  project: default
  source:
    repoURL: https://github.com/34fathombelow/rendered-appset-manifest.git
    targetRevision: rendered-dev
    # The branch is flat: one <application>.yaml per file at its root.
    path: .
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    # Pruning here decides whether an Application that stopped generating is
    # deleted -- and because generated Applications carry resources-finalizer,
    # deleting one also deletes its workloads.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  revisionHistoryLimit: 10
