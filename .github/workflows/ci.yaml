name: CI

# One workflow so that publishing can depend on validation: `render` needs
# `validate`, so nothing reaches a generated branch until the offline checks pass.
#
# Deliberately no kustomize or helm here. This pipeline renders ArgoCD
# Applications, not the workloads they point at, so building every overlay meant
# installing two extra tools and pulling the same Helm charts on every run, which
# also made publishing depend on upstream chart repos being reachable. The
# consequence is that a broken overlay is not caught here; it fails at sync.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "appsets/**"
      - "clusters/**"
      - "apps/**"
      - "addons/**"
      - "scripts/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

# Read-only by default; only the render job is granted write, to push the
# render/<env> branches and open each env's PR against its rendered-<env> branch.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /tmp/yq && sudo mv /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Validate source of truth
        run: ./scripts/validate.sh

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

  render:
    needs: [validate]
    # Never publish from a pull request: it must not see the ArgoCD token, and a
    # PR has no business rewriting the generated branches.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install argocd CLI and yq
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          curl -sSL -o /tmp/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /tmp/argocd /tmp/yq
          sudo mv /tmp/argocd /usr/local/bin/argocd
          sudo mv /tmp/yq /usr/local/bin/yq
          argocd version --client --short
          yq --version

      # Every file in appsets/ is rendered into one tree; adding an AppSet needs
      # no change here.
      - name: Render all AppSets
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          ARGOCD_OPTS: --grpc-web
          # Render the pushed commit, not whatever ArgoCD's cache says main is.
          RENDER_REVISION: ${{ github.sha }}
        run: ./scripts/render.sh "$RUNNER_TEMP/rendered"

      - name: Open one PR per env against rendered-<env>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/publish.sh "$RUNNER_TEMP/rendered"

      - name: Summary
        run: |
          {
            echo "### PRs against \`rendered-<env>\`"
            echo
            echo "| env | applications |"
            echo "|-----|--------------|"
            for d in "$RUNNER_TEMP"/rendered/*/; do
              [ -d "$d" ] || continue
              echo "| $(basename "$d") | $(find "$d" -name '*.yaml' | wc -l | tr -d ' ') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
