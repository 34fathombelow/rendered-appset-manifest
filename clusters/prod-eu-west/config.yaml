# Consumed by the git *files* generator in appsets/apps.yaml and appsets/addons.yaml.
# Every key here becomes an ApplicationSet parameter, nested exactly as written.
cluster:
  # Must match the cluster's name as registered in ArgoCD: generated
  # Applications use a name-based destination, not a server URL.
  name: prod-eu-west
  env: prod
  region: eu-west-1
  # Addons this cluster gets, by directory name under addons/. Use [] for none.
  addons: []
