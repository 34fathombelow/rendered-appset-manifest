# Platform addon track.
#
# matrix( matrix( git-files(clusters/*/config.yaml) x list(cluster.addons) )
#         x git-files(addons/<addon>/overlays/<env>/addon.yaml) )
#
# Addons are opt-in per cluster: each clusters/<name>/config.yaml lists the addons
# it gets under cluster.addons. The inner matrix turns that list into one
# (cluster, addon) pair per enabled addon; a selector cannot do this, because it
# cannot compare one parameter against a list held in another.
#
# The outer git *files* generator then reads that addon's overlay for the
# cluster's env. addon.yaml supplies the target namespace, which a directory
# listing cannot. An addon with no overlay for an env is skipped for it, and
# scripts/validate.sh fails if a cluster enables an addon that does not exist.
#
# NOTE: the cluster files generator and the overlay files generator both emit a
# `path` parameter and in a matrix the FIRST one wins, so the overlay generator
# sets `pathParamPrefix: overlay` and the addon overlay is `.overlay.path`.
# (Not `addon`: that key already holds addon.yaml's content.)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - git:
                    repoURL: https://github.com/34fathombelow/rendered-appset-manifest.git
                    revision: main
                    files:
                      - path: clusters/*/config.yaml
                # A list generator needs objects, not strings, so this wraps each
                # name in cluster.addons as {"enabledAddon": "<name>"}.
                - list:
                    elementsYaml: '[{{ range $i, $a := .cluster.addons }}{{ if $i }},{{ end }}{"enabledAddon": "{{ $a }}"}{{ end }}]'
          - git:
              repoURL: https://github.com/34fathombelow/rendered-appset-manifest.git
              revision: main
              pathParamPrefix: overlay
              files:
                - path: addons/{{ .enabledAddon }}/overlays/{{ .cluster.env }}/addon.yaml
  template:
    metadata:
      name: '{{ .addon.name }}-{{ .cluster.name }}'
      labels:
        # Same contract with scripts/render.sh as appsets/apps.yaml.
        gitops.34fathombelow.io/track: addons
        gitops.34fathombelow.io/env: '{{ .cluster.env }}'
        gitops.34fathombelow.io/cluster: '{{ .cluster.name }}'
        app.kubernetes.io/name: '{{ .addon.name }}'
        app.kubernetes.io/part-of: addons
      annotations:
        gitops.34fathombelow.io/source-path: '{{ .overlay.path.path }}'
    spec:
      project: addons
      source:
        repoURL: https://github.com/34fathombelow/rendered-appset-manifest.git
        targetRevision: main
        path: '{{ .overlay.path.path }}'
      destination:
        # Must match the cluster's name as registered in ArgoCD.
        name: '{{ .cluster.name }}'
        namespace: '{{ .addon.namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
      revisionHistoryLimit: 5
